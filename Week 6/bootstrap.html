<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Boot strap</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="container mt-3">
        <h2>Button Styles</h2>
        <button type="button" class="btn">Basic</button>
        <button type="button" class="btn btn-primary">Primary</button>
        <button type="button" class="btn btn-secondary">Secondary</button>
        <button type="button" class="btn btn-success">Success</button>
        <button type="button" class="btn btn-info">Info</button>
        <button type="button" class="btn btn-warning">Warning</button>
        <button type="button" class="btn btn-danger">Danger</button>
        <button type="button" class="btn btn-dark">Dark</button>
        <button type="button" class="btn btn-light">Light</button>
        <button type="button" class="btn btn-link">Link</button>      
        </div>

        <div class="dropdown">
        <button class="btn btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            Dropdown
        </button>
        <ul class="dropdown-menu">
            <li><button class="dropdown-item" type="button">Dropdown item</button></li>
            <li><button class="dropdown-item" type="button">Dropdown item</button></li>
            <li><button class="dropdown-item" type="button">Dropdown item</button></li>
        </ul>
        </div>
           <br> 

        <div class="d-grid gap-3">
        <button type="button" class="btn btn-primary btn-block">Full-Width Button</button>
        <button type="button" class="btn btn-primary btn-block">Full-Width Button</button>
        <button type="button" class="btn btn-primary btn-block">Full-Width Button</button>
        </div>
        <br>
        <br>
        <div clas="flex">
            <div class="row">
                <div class="col-md-12 bg-primary">Span 12 columns</div>
            </div>
            <div class="row">
                <div class="col-md-6 bg-secondary"> 6 units</div>
                <div class="col-md-6 bg-succes"> 6 units</div>
            </div>
            <div class="row">
                <div class="col-md-4 bg-danger"> 4 units</div>
                <div class="col-md-8 bg-warning"> 8 units</div>
            </div>
            <div class="row">
                <div class="col-md-4 bg-dark"> 4 units</div>
                <div class="col-md-4 bg-info"> 4 units</div>
            </div>

            <div class="row">
                <div class="col-md-2 bg-primary"> 2 units</div>
                <div class="col-md-2 bg-light"> 2 units</div>
            </div>
        </div>     

    </body>
</html>
