<html>
<body>

<h1 style="text-align:center;">Simple Calc</h1>

<label>Number1</label>
<input type="number" id="num1"><br><br>

<label>Number2</label>
<input type="number" id="num2"><br><br>

<button onclick="calculate()">Addition</button>
<button onclick="calculate1()">Subraction</button>
<button onclick="calculate2()">Multiplication</button>
<button onclick="calculate3()">Division</button>

<p id="output" style="text-align:center; font-weight:bold; font-size:20px; margin-top:20px;"></p>
<p id="output1" style="text-align:center; font-weight:bold; font-size:20px; margin-top:20px;"></p>
<p id="output2" style="text-align:center; font-weight:bold; font-size:20px; margin-top:20px;"></p>
<p id="output3" style="text-align:center; font-weight:bold; font-size:20px; margin-top:20px;"></p>

<script>
function calculate() {
    var num1 = Number(document.getElementById('num1').value);
    var num2 = Number(document.getElementById('num2').value);

    if (isNaN(num1) || isNaN(num2)) {
        document.getElementById('output').textContent = "Please enter valid numbers.";
        return;
    }

    var result = num1 + num2;
    document.getElementById('output').textContent = "Addition: " + result;
}
</script>
<script>
function calculate1() {
    var num1 = Number(document.getElementById('num1').value);
    var num2 = Number(document.getElementById('num2').value);

    if (isNaN(num1) || isNaN(num2)) {
        document.getElementById('output1').textContent = "Please enter valid numbers.";
        return;
    }

    var result = num1 - num2;
    document.getElementById('output1').textContent = "Subtration: " + result;
}
</script>
<script>
function calculate2() {
    var num1 = Number(document.getElementById('num1').value);
    var num2 = Number(document.getElementById('num2').value);

    if (isNaN(num1) || isNaN(num2)) {
        document.getElementById('output2').textContent = "Please enter valid numbers.";
        return;
    }

    var result = num1 * num2;
    document.getElementById('output2').textContent = "Multiplication: " + result;
}
</script>
<script>
function calculate3() {
    var num1 = Number(document.getElementById('num1').value);
    var num2 = Number(document.getElementById('num2').value);

    if (isNaN(num1) || isNaN(num2)) {
        document.getElementById('output3').textContent = "Please enter valid numbers.";
        return;
    }

    var result = (num1 / num2);
    document.getElementById('output3').textContent = "Division: " + result;
}
</script>
</body>
</html>
