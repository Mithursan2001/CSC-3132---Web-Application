<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Student Registration</title>
    <link rel="stylesheet" href="style.css">

    <script>
        function validateForm() {
            let fullName = document.forms["regForm"]["full_name"].value;
            let email = document.forms["regForm"]["email"].value;
            let course = document.forms["regForm"]["course"].value;

            if (fullName === "" || email === "" || course === "") {
                alert("All fields are required.");
                return false;
            }

            alert("Registration submitted.");
            return true;
        }
    </script>
</head>

<body>

    <h2>Online Registration</h2>

    <form name="regForm" action="save_reg.php" method="POST" onsubmit="return validateForm();">
        <label for="full_name">Full Name:</label>
        <input type="text" id="full_name" name="full_name" placeholder="Full Name" required><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Email" required><br>
        <label for="course">Course:</label>
        <input type="text" id="course" name="course" placeholder="Course" required><br>
        <button type="submit">Register</button>
    </form>

    <button class="view-btn" onclick="window.location.href='view_reg.php'">View All Registrations</button>

</body>
</html>
