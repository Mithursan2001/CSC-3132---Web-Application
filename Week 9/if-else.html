<!DOCTYPE html>
<html>
<head>
    <title>Subject Grade Table</title>
    <style>
        table {
            border-collapse: collapse;
            width: 50%;
            margin: 40px auto;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
        }
        th {
            background-color: #f2f2f2;
        }
        input {
            width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h2 style="text-align:center;">Student Grade Table</h2>

    <table>
        <tr>
            <th>Subject</th>
            <th>Marks</th>
            <th>Grade</th>
        </tr>
        <tr>
            <td>Tamil</td>
            <td><input type="number" id="tamil" oninput="updateGrade('tamil', 'grade1')" placeholder="Marks"></td>
            <td id="grade1"></td>
        </tr>
        <tr>
            <td>Science</td>
            <td><input type="number" id="science" oninput="updateGrade('science', 'grade2')" placeholder="Marks"></td>
            <td id="grade2"></td>
        </tr>
        <tr>
            <td>Maths</td>
            <td><input type="number" id="maths" oninput="updateGrade('maths', 'grade3')" placeholder="Marks"></td>
            <td id="grade3"></td>
        </tr>
    </table>

    <script>

        function getGrade(marks) {
                if (marks >= 75) return "A";
                else if (marks >= 65) return "B";
                else if (marks >= 55) return "C";
                else return "F";
            }

        function updateGrade(inputId, gradeId) {
            var marks = parseFloat(document.getElementById(inputId).value);
            document.getElementById(gradeId).innerText = getGrade(marks);
        }
    </script>
</body>
</html>
