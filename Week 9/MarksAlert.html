<!DOCTYPE html>
<html>
<head>
  <title>Marks Form</title>
</head>
<body>


<h2>Enter Your Marks (1-100)</h2>
<form name="marksform" onsubmit="validateMarks(); return false;">
  <label for="marks">Marks:</label>
  <input type="number" id="marks" name="marks" placeholder="Enter marks">
  <input type="submit" value="Submit">
</form>

<script>
  
  function validateMarks() {
    let marks = parseFloat(document.marksform.marks.value);

    if (isNaN(marks)) {
      alert("Please enter your marks!");
    } else if (marks < 1) {
      alert("Marks cannot be less than 1!");
    } else if (marks > 100) {
      alert("Marks cannot exceed 100!");
    } else {
      alert("Your marks are: " + marks);
    }
  }
</script>

</body>
</html>
