<!DOCTYPE html>
<html>
<head>
  <title>Auto Grade Calculator</title>
  <style>
    table {
      border-collapse: collapse;
      width: 300px;
    }
    td {
      border: 1px solid #ccc;
      padding: 8px;
    }
    input {
      width: 90%;
      padding: 5px;
      text-align: center;
      font-weight: bold;
      font-size: 1em;
    }
  </style>
</head>
<body>

  <table>
    <tr>
      <td>Maths</td>
      <td><input type="number" id="marks1" placeholder="Enter marks" oninput="calculateGrade(1)"></td>
      <td><input type="text" id="grade1" readonly></td>
    </tr>
    <tr>
      <td>Science</td>
      <td><input type="number" id="marks2" placeholder="Enter marks" oninput="calculateGrade(2)"></td>
      <td><input type="text" id="grade2" readonly></td>
    </tr>
    <tr>
      <td>History</td>
      <td><input type="number" id="marks3" placeholder="Enter marks" oninput="calculateGrade(3)"></td>
      <td><input type="text" id="grade3" readonly></td>
    </tr>
  </table>

  <script>
    function calculateGrade(num) {
      const marksInput = document.getElementById("marks" + num);
      const gradeInput = document.getElementById("grade" + num);
      const marks = parseFloat(marksInput.value);
      let grade = "";

      if (isNaN(marks)) {
        grade = "";
        gradeInput.style.color = "black";
        gradeInput.style.backgroundColor = "white";
      } else if (marks >= 75) {
        grade = "A";
        gradeInput.style.color = "green";
        gradeInput.style.backgroundColor = "#d4edda"; 
      } else if (marks >= 65) {
        grade = "B";
        gradeInput.style.color = "blue";
        gradeInput.style.backgroundColor = "#cce5ff"; 
      } else if (marks >= 55) {
        grade = "C";
        gradeInput.style.color = "orange";
        gradeInput.style.backgroundColor = "#fff3cd"; 
      } else {
        grade = "F";
        gradeInput.style.color = "red";
        gradeInput.style.backgroundColor = "#f8d7da"; 
      }

      gradeInput.value = grade;
    }
  </script>

</body>
</html>
