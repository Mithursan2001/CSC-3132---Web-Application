<!DOCTYPE html>
<html>
<head>
    <title>Online Book Store</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script>
        function validateBook(e) {
            e.preventDefault(); 

            let title = document.forms["bookForm"]["title"].value.trim();
            let author = document.forms["bookForm"]["author"].value.trim();
            let price = document.forms["bookForm"]["price"].value.trim();
            let category = document.forms["bookForm"]["category"].value;

            if (title === "" || author === "" || price === "" || category === "" || parseFloat(price) <= 0) {
                alert("All fields are required and price must be greater than 0");
                return false;
            }

            let table = document.getElementById("bookTable");
            let row = table.insertRow();
            row.insertCell(0).innerText = title;
            row.insertCell(1).innerText = author;
            row.insertCell(2).innerText = parseFloat(price).toFixed(2);
            row.insertCell(3).innerText = category;

            
            let xhr = new XMLHttpRequest();
            xhr.open("POST", "insert.php", true);
            xhr.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    console.log(xhr.responseText);
                }
            };
            xhr.send("title=" + encodeURIComponent(title) +
                     "&author=" + encodeURIComponent(author) +
                     "&price=" + encodeURIComponent(price) +
                     "&category=" + encodeURIComponent(category));

            alert("Book Added Successfully!");
            document.getElementById("bookForm").reset();
            return false;
        }
    </script>
</head>
<body>

<h2 style="text-align:center;">Add a New Book</h2>

<form id="bookForm" name="bookForm" onsubmit="return validateBook(event)">
    <label>Book Title</label>
    <input type="text" name="title" placeholder="Enter Book Title"><br><br>

    <label>Author</label>
    <input type="text" name="author" placeholder="Enter Author Name"><br><br>

    <label>Price</label>
    <input type="number" name="price" placeholder="Enter Price" min="1"><br><br>

    <label>Category</label>
    <select name="category">
        <option value="">Select Category</option>
        <option value="Fiction">Fiction</option>
        <option value="Science">Science</option>
        <option value="Kids">Kids</option>
    </select><br><br>

    <button type="submit">Add Book</button>
</form>

<br>

<table id="bookTable">
    <tr>
        <th>Book Title</th>
        <th>Author</th>
        <th>Price</th>
        <th>Category</th>
    </tr>
</table>

</body>
</html>
