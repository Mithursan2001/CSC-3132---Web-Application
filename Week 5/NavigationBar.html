<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Navigation Bar with Logo</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .navbar {
      background-color: #333;
      overflow: hidden;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }

    .navbar a {
      color: white;
      padding: 14px 20px;
      text-decoration: none;
      display: block;
    }

    .navbar a:hover {
      background-color: #575757;
    }

    .navbar .logo img {
      height: 40px; /* Adjust size as needed */
    }

    .navbar .nav-links {
      display: flex;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="logo">
      <img src="Z:\2021ASP32\3. Third Year\1st semester\CSC 3132(P)\Week 5\logo.png" alt="Logo">
    </div>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
    </div>
  </div>

</body>
</html>
