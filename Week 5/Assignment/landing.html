<!DOCTYPE html>
<html>
<head>
  <title>Welcome Page</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: url('image.jpg') no-repeat center center/cover; 
    }

    .container {
      padding: 150px 20px;
      background: rgba(255, 255, 255, 0.4);
    }

    h1 {
      color: red;
      font-size: 48px;
      margin-bottom: 15px;
    }

    p {
      color: blue;
      font-size: 18px;
      margin-bottom: 20px;
    }

    .btn {
      padding: 12px 25px;
      font-size: 16px;
      background: rgb(16, 173, 16);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
    }

    .btn:hover {
      background: rgb(21, 160, 21);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to Our Site</h1>
    <p>We provide amazing services for you</p>
    <a href="#" class="btn">Get Started</a>
  </div>
</body>
</html>
