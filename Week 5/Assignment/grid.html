<!DOCTYPE html>
<html>
<head>
  <title>Our Products</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h2 {
      margin-bottom: 20px;
    }

    .product-grid {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      text-align: center;
      padding: 15px;
      width: 250px;
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 6px;
      background: #ddd;
    }

    .card h3 {
      margin: 10px 0 5px;
    }

    .price {
      font-size: 16px;
      margin: 5px 0;
      color: #9b9292;
    }

    .buy-btn {
      background: #4CAF50;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .buy-btn:hover {
      background: #45a049;
    }
  </style>
</head>
<body>
  <h2>Our Products</h2>
  
  <div class="product-grid">
    <div class="card">
      <img src="https://placehold.co/150x150?text=z" alt="Product 1">
      <h3>Product 1</h3>
      <p class="price">$10</p>
      <button class="buy-btn">Buy Now</button>
    </div>

    <div class="card">
      <img src="https://placehold.co/150x150?text=z" alt="Product 2">
      <h3>Product 2</h3>
      <p class="price">$20</p>
      <button class="buy-btn">Buy Now</button>
    </div>

    <div class="card">
      <img src="https://placehold.co/150x150?text=z" alt="Product 3">
      <h3>Product 3</h3>
      <p class="price">$30</p>
      <button class="buy-btn">Buy Now</button>
    </div>
  </div>
</body>
</html>
