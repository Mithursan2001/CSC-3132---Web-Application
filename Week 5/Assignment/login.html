<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 700px;
        margin: 0;
    }
    .loginbox {
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        width: 300px;
        text-align: center;
    }
    .loginbox h2 {
        margin-bottom: 20px;
    }
    .loginbox input {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    .loginbox button {
        width: 100%;
        padding: 10px;
        background: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
    }
    .loginbox button:hover {
        background: #45a049;
    }
  </style>
</head>
<body>
  <div class="loginbox">
    <h2>Login</h2>
    <form action="login">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
