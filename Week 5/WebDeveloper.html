<html>
<head>
  <title>Profile Card</title>
  <style>
    body {
      background-color: #f0f2f5;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .profile-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 300px;
      text-align: center;
      padding: 20px;
    }

    .profile-card img {
      border-radius: 50%;
      width: 100px;
      height: 100px;
      object-fit: cover;
      margin-bottom: 15px;
    }

    .profile-card h2 {
      margin: 10px 0 5px;
      font-size: 22px;
    }

    .profile-card p {
      color: #666;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .profile-card button {
      display: inline-block;
      padding: 8px 16px;
      background-color: #007bff;
      color: white;
      border-radius: 5px;
      text-decoration: none;
      font-size: 14px;
    }

    .profile-card button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="profile-card">
    <img src="https://placehold.co/150x150?text=z" alt="Profile Picture">
    <h2>Jane Doe</h2>
    <p>Web Developer</p>
    <button>Follow</button>
  </div>

</body>
</html>
